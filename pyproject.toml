[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "adaptive-ui-runtime"
version = "0.1.0"
description = "Accuracy-first adaptive runtime for fast browser and UI automation"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Rajeev"}]
dependencies = [
  "pydantic>=2.9",
  "pydantic-ai-slim[openai]>=0.2",
  "dbos>=2.0",
  "mcp>=1.9",
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
local = ["mlx-vlm>=0.2"]        # Fara-4B / ShowUI-2B local visual workers
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
  "mypy>=1.13",
  "playwright>=1.48",   # real-browser smoke test; reuses existing Chromium
]

[project.scripts]
aur = "adaptive_ui_runtime.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
